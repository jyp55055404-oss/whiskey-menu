name: Daily Firebase Backup

on:
  schedule:
    # 매일 04:00 KST (= 전날 19:00 UTC)
    - cron: '0 19 * * *'
  workflow_dispatch:   # 수동 실행 버튼도 제공

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Firebase data and commit backup
        run: |
          set -e
          mkdir -p backups
          DATE=$(TZ=Asia/Seoul date +'%Y-%m-%d')
          BASE="https://whiskey-menu-464ff-default-rtdb.asia-southeast1.firebasedatabase.app"
          OUT="backups/whiskey_backup_${DATE}.json"

          # 메뉴(/menu)와 사진(/images/{id}/v{imageVer})은 따로 저장되어 있다.
          # 백업 파일은 예전과 같은 형식(사진 인라인)으로 합쳐서 만든다 → "백업 가져오기"로 그대로 복원 가능.
          # 둘 중 하나라도 못 받으면 백업을 만들지 않고 실패 처리한다 (사진 빠진 파일이 정상 백업 행세를 못 하게).
          curl -sf "$BASE/menu.json" -o /tmp/menu.json
          curl -sf "$BASE/images.json" -o /tmp/images.json
          [ -s /tmp/menu.json ] && [ -s /tmp/images.json ] || { echo "Firebase fetch failed"; exit 1; }
          if grep -qx 'null' /tmp/menu.json; then echo "Firebase returned empty menu - aborting"; exit 1; fi

          # 사진이 있어야 할 메뉴(imageVer)인데 해당 버전 사진이 없으면 실패
          MISSING=$(jq --slurpfile imgs /tmp/images.json '
            ($imgs[0] // {}) as $im
            | (if type == "object" then [.[]] else . end)
            | map(select(.imageVer != null and (.id|type) == "string"
                         and (($im[.id] // {})["v" + (.imageVer|tostring)] | type) != "string"))
            | length' /tmp/menu.json)
          if [ "$MISSING" != "0" ]; then
            echo "Backup aborted: $MISSING item(s) have imageVer but no photo in /images"
            exit 1
          fi

          jq -c --slurpfile imgs /tmp/images.json '
            ($imgs[0] // {}) as $im
            | (if type == "object" then [.[]] else . end)
            | map(
                . as $it
                | (if ($it.imageVer != null and ($it.id|type) == "string")
                   then (($im[$it.id] // {})["v" + ($it.imageVer|tostring)]) else null end) as $img
                | (if $img != null then .image = $img else . end)
                | del(.imageVer)
              )
          ' /tmp/menu.json > "$OUT"

          # 빈 결과면 백업하지 않고 중단
          if [ ! -s "$OUT" ] || [ "$(jq 'length' "$OUT")" = "0" ]; then
            echo "Backup produced no items - aborting"
            rm -f "$OUT"
            exit 1
          fi

          # 최근 30일치만 유지, 오래된 건 삭제
          ls -1t backups/whiskey_backup_*.json | tail -n +31 | xargs -r rm -f

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily backup ${DATE}"
            git push
          fi
